<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Studio 实景 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe3e6; font-family: -apple-system, "PingFang SC", sans-serif; }
  #bar { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 2; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 14px; white-space: nowrap; background: rgba(255,255,255,.92); color: #333; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #tip { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #555; background: rgba(255,255,255,.7); padding: 6px 10px; border-radius: 6px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <button id="bview">走进房间</button>
  <button id="bnight">切到夜晚</button>
  <button id="bdesign">看现在的样子</button>
</div>
<div id="tip">拖动旋转 · 滚轮缩放</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3e6);
let parent = scene;
const nowGroup = new THREE.Group(), designGroup = new THREE.Group();
scene.add(nowGroup, designGroup);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.3;
controls.maxPolarAngle = Math.PI * 0.62;

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

// 光：白天是从窗户斜射进来的日光，夜里是屋顶暖灯 + 床头灯带
const hemi = new THREE.HemisphereLight(0xffffff, 0xc9b79a, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.set(-0.5, 5.2, -17);
sun.target.position.set(1.8, 0.4, -2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 30 });
scene.add(sun, sun.target);
const lamp = new THREE.PointLight(0xfff3e0, 3, 0, 2);
lamp.position.set(1.7, 2.45, -1.9);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.002;
scene.add(lamp);
const cove = new THREE.PointLight(0xffc878, 0, 0, 2);
cove.position.set(2.7, 2.2, -4.9);
scene.add(cove);

// ---------- 贴图（用画布现画，颜色按照片取） ----------
function tex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const R = Math.random;
function planks(g, w, h, strips, hue, sat, l0, l1) {
  const sw = w / strips;
  for (let i = 0; i < strips; i++) {
    const off = R() * h;
    for (let k = -2; k < 2; k++) {
      const y = off + k * h / 2;
      g.fillStyle = `hsl(${hue + R() * 6}, ${sat + R() * 8}%, ${l0 + R() * (l1 - l0)}%)`;
      g.fillRect(i * sw, y, sw, h / 2);
      for (let j = 0; j < 26; j++) {            // 木纹
        g.strokeStyle = `rgba(70,40,15,${0.04 + R() * 0.1})`;
        g.lineWidth = 0.6 + R() * 1.6;
        const x = i * sw + R() * sw;
        g.beginPath(); g.moveTo(x, y);
        g.bezierCurveTo(x + R() * 8 - 4, y + h / 6, x + R() * 8 - 4, y + h / 3, x + R() * 6 - 3, y + h / 2);
        g.stroke();
      }
      g.fillStyle = 'rgba(40,22,8,.55)';
      g.fillRect(i * sw, y, sw, 2);
    }
    g.fillStyle = 'rgba(40,22,8,.5)';
    g.fillRect(i * sw, 0, 1.5, h);
  }
}
const T = {
  floor: tex(1024, 1024, (g, w, h) => planks(g, w, h, 8, 27, 34, 44, 56)),
  oak: tex(512, 512, (g, w, h) => planks(g, w, h, 1, 31, 42, 60, 64)),
  tile: tex(256, 256, (g, w, h) => {
    g.fillStyle = '#b4aea5'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${R() < .5 ? '255,255,255' : '60,55,50'},${R() * .05})`; g.fillRect(R() * w, R() * h, 3, 3); }
    g.fillStyle = '#e9e6e0'; g.fillRect(0, 0, w, 5); g.fillRect(0, 0, 5, h);
  }),
  fabric: tex(256, 256, (g, w, h) => {
    g.fillStyle = '#ddd8cd'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(95,92,86,${0.15 + R() * .4})`; g.fillRect(R() * w, R() * h, 2 + R() * 5, 1.5); }
  }),
  front: tex(256, 256, (g, w, h) => {
    g.fillStyle = '#bcb6aa'; g.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 3) { g.fillStyle = `rgba(255,255,255,${R() * .22})`; g.fillRect(0, y, w, 1.5); }
  }),
  linen: tex(128, 128, (g, w, h) => {
    g.fillStyle = '#b3aba1'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(255,255,255,${R() * .12})`; g.fillRect(R() * w, R() * h, 1, 4); }
  }),
};
const rep = (t, u, v) => { const c = t.clone(); c.repeat.set(u, v); c.needsUpdate = true; return c; };
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });
const M = {
  wall: mat(0xefe2bd, { roughness: 0.95 }),
  white: mat(0xf6f5f1, { roughness: 0.6 }),
  ceil: mat(0xf8f7f3, { roughness: 0.95 }),
  balc: mat(0xd7d4cd, { roughness: 0.95 }),
  tileWall: mat(0xffffff, { map: rep(T.tile, 1 / 0.3, 1 / 0.6), roughness: 0.35 }),
  front: mat(0xffffff, { map: rep(T.front, 1, 2), roughness: 0.6 }),
  oak: mat(0xffffff, { map: T.oak, roughness: 0.55 }),
  black: mat(0x1d1e21, { roughness: 0.4, metalness: 0.3 }),
  steel: mat(0xc2c5c8, { roughness: 0.25, metalness: 0.9 }),
  door: mat(0x666b73, { roughness: 0.55 }),
  navy: mat(0x262b40, { roughness: 0.6 }),
  pink: mat(0xe7b3b0, { roughness: 0.55 }),
  mirror: mat(0xffffff, { roughness: 0.03, metalness: 1 }),
  curtain: mat(0x6f6b69, { roughness: 1, side: THREE.DoubleSide }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, roughness: 0.02, side: THREE.DoubleSide, depthWrite: false }),
};

// ---------- 基础零件。坐标：x 向东，n 向北（窗户方向），three 里 z = -n ----------
function add(geo, m, x, y, n, shadow = true) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, -n);
  o.castShadow = o.receiveShadow = shadow;
  parent.add(o);
  return o;
}
const box = (x0, x1, y0, y1, n0, n1, m) =>
  add(new THREE.BoxGeometry(x1 - x0, y1 - y0, n1 - n0), m.isMaterial ? m : mat(m), (x0 + x1) / 2, (y0 + y1) / 2, (n0 + n1) / 2);
const rbox = (x0, x1, y0, y1, n0, n1, m, r = 0.03) =>
  add(new RoundedBoxGeometry(x1 - x0, y1 - y0, n1 - n0, 4, r), m.isMaterial ? m : mat(m), (x0 + x1) / 2, (y0 + y1) / 2, (n0 + n1) / 2);
const cyl = (r, h, x, y, n, m, r2 = r) =>
  add(new THREE.CylinderGeometry(r2, r, h, 32), m.isMaterial ? m : mat(m), x, y, n);
function rod(a, b, r, m) {              // 两点之间的细杆
  const A = new THREE.Vector3(a[0], a[1], -a[2]), B = new THREE.Vector3(b[0], b[1], -b[2]);
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 12), m);
  o.position.copy(A).add(B).multiplyScalar(0.5);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  o.castShadow = true;
  parent.add(o);
}
// 单面墙：只从 inside 一侧看得见，所以从屋外任何角度都能看进屋里
function wall(x1, n1, x2, n2, y0, y1, inside, m = M.wall) {
  let a = [x1, -n1], b = [x2, -n2];
  const dx = b[0] - a[0], dz = b[1] - a[1];
  if (-dz * (inside[0] - a[0]) + dx * (-inside[1] - a[1]) < 0) [a, b] = [b, a];
  const L = Math.hypot(dx, dz), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([a[0], y0, a[1], b[0], y0, b[1], b[0], y1, b[1], a[0], y1, a[1]], 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, y0, L, y0, L, y1, 0, y1], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  g.computeVertexNormals();
  const o = new THREE.Mesh(g, m);
  o.receiveShadow = o.castShadow = true;
  scene.add(o);
}
function floor(x0, x1, n0, n1, t, su, sv) {
  box(x0, x1, -0.05, 0, n0, n1, mat(0xffffff, { map: rep(t, (x1 - x0) / su, (n1 - n0) / sv), roughness: t === T.tile ? 0.35 : 0.5 })).castShadow = false;
}
function ceiling(x0, x1, n0, n1, y = 2.6) {     // 只从下面看得见
  const o = add(new THREE.PlaneGeometry(x1 - x0, n1 - n0), M.ceil, (x0 + x1) / 2, y, (n0 + n1) / 2, false);
  o.rotation.x = Math.PI / 2;
}
function windowAt(x0, x1, y0, y1, n, mullions = []) {
  add(new THREE.PlaneGeometry(x1 - x0, y1 - y0), M.glass, (x0 + x1) / 2, (y0 + y1) / 2, n, false);
  const t = 0.045, d = 0.03;
  box(x0, x1, y0, y0 + t, n - d, n + d, M.black); box(x0, x1, y1 - t, y1, n - d, n + d, M.black);
  box(x0, x0 + t, y0, y1, n - d, n + d, M.black); box(x1 - t, x1, y0, y1, n - d, n + d, M.black);
  for (const x of mullions) box(x - t / 2, x + t / 2, y0, y1, n - d, n + d, M.black);
}
function curtain(x0, x1, y0, y1, n, folds = 7, m = M.curtain) {
  const g = new THREE.PlaneGeometry(x1 - x0, y1 - y0, 80, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, Math.sin(p.getX(i) / (x1 - x0) * Math.PI * 2 * folds) * 0.025);
  g.computeVertexNormals();
  return add(g, m, (x0 + x1) / 2, (y0 + y1) / 2, n);
}
const bottle = (x, n, y, h, c, r = 0.028) => { cyl(r, h, x, y + h / 2, n, mat(c, { roughness: 0.3 })); cyl(r * 0.4, 0.04, x, y + h + 0.02, n, mat(0xeeeeee)); };

const H = 2.6;

// ---------- 地面、天花 ----------
floor(0, 3.4, 0, 3.8, T.floor, 1.2, 1.8);
floor(3.4, 3.85, 3.5, 3.8, T.floor, 1.2, 1.8);
floor(1.7, 3.85, 3.8, 5.4, T.floor, 1.2, 1.8);
floor(1.7, 2.75, -0.6, 0, T.floor, 1.2, 1.8);
floor(0, 1.6, 3.8, 5.0, T.tile, 0.4, 0.4);
floor(2.8, 4.2, -1.3, 0, T.tile, 0.3, 0.3);
ceiling(0, 3.4, 0, 3.8); ceiling(3.4, 3.85, 3.5, 3.8);
ceiling(1.7, 3.85, 3.8, 5.4, 2.3);              // 床区吊顶更低
ceiling(0, 1.6, 3.8, 5.0); ceiling(1.7, 2.75, -0.6, 0); ceiling(2.8, 4.2, -1.3, 0);

// ---------- 主间墙 ----------
const IN = [1.7, 1.9];
wall(0, 0, 0, 3.8, 0, H, IN);
wall(3.4, 0, 3.4, 3.5, 0, H, IN);
wall(0, 0, 0.55, 0, 0, H, IN);
wall(0.55, 0, 1.45, 0, 2.05, H, IN);
wall(1.45, 0, 1.7, 0, 0, H, IN);
wall(1.7, 0, 2.75, 0, 2.3, H, IN, M.white);
wall(2.75, 0, 2.8, 0, 0, H, IN);
wall(2.8, 0, 3.4, 0, 2.03, H, IN);
wall(0, 3.8, 0.15, 3.8, 0, H, IN);
wall(0.15, 3.8, 1.05, 3.8, 2.1, H, IN);
wall(1.05, 3.8, 1.7, 3.8, 0, H, IN);
wall(1.7, 3.8, 3.4, 3.8, 2.3, H, IN, M.white);
wall(3.4, 3.5, 3.85, 3.5, 0, H, [3.6, 3.7]);
wall(3.85, 3.5, 3.85, 5.4, 0, H, [3.0, 4.5]);
for (const [a, b] of [[0, 0.55], [1.45, 1.7]]) box(a, b, 0, 0.07, 0, 0.012, M.white);   // 踢脚线

// ---------- 床区 ----------
const BED = [2.7, 4.6];
wall(1.7, 3.8, 1.7, 5.4, 0, H, BED);
wall(1.7, 5.4, 1.78, 5.4, 0, H, BED);
wall(3.2, 5.4, 3.85, 5.4, 0, H, BED);
wall(1.78, 5.4, 3.2, 5.4, 0, 1.0, BED);
wall(1.78, 5.4, 3.2, 5.4, 2.0, H, BED);
windowAt(1.78, 3.2, 1.0, 2.0, 5.4, [2.12]);
box(1.76, 3.22, 0.96, 1.0, 5.3, 5.42, mat(0x9a948a, { roughness: 0.3 }));   // 石材窗台
parent = nowGroup;
curtain(3.05, 3.5, 0.9, 2.05, 5.32, 4);
parent = scene;
rbox(1.78, 3.75, 0.02, 0.3, 3.95, 5.35, mat(0xffffff, { map: rep(T.oak, 1, 1) }), 0.01);  // 木床箱
rbox(1.8, 3.74, 0.3, 0.5, 3.97, 5.35, 0x3f4855, 0.04);                                    // 床垫
{ // 起皱的浅蓝被子
  const g = new THREE.BoxGeometry(1.5, 0.12, 1.42, 60, 1, 60), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    if (p.getY(i) > 0) p.setY(i, 0.06 + 0.03 * Math.sin(x * 9 + z * 5) + 0.022 * Math.sin(x * 5 - z * 13 + 1) + 0.012 * Math.sin(x * 21 + z * 17) + 0.01 * Math.sin(z * 29 - x * 8));
  }
  g.computeVertexNormals();
  add(g, mat(0xcfe5e8, { roughness: 0.95 }), 2.56, 0.55, 4.66);
}
rbox(3.2, 3.72, 0.5, 0.62, 4.1, 5.15, mat(0xf2efe9, { roughness: 1 }), 0.055);            // 枕头
rbox(3.75, 3.85, 0.3, 1.0, 3.95, 5.38, mat(0xffffff, { map: rep(T.linen, 1, 4) }), 0.03); // 软包床头
box(1.72, 1.78, 0, 0.75, 3.95, 5.35, M.white);                                            // 床尾矮板
box(1.78, 3.75, 0.5, 0.95, 5.37, 5.4, M.white);                                           // 靠窗护板
add(new THREE.SphereGeometry(0.075, 16, 12), mat(0xd96a2e, { roughness: 1 }), 3.6, 0.7, 5.25);   // 小狐狸
add(new THREE.SphereGeometry(0.035, 12, 8), mat(0xf4efe6), 3.57, 0.68, 5.2);
box(3.45, 3.82, 0, 0.5, 3.53, 3.9, M.white);                                              // 床头柜
box(3.44, 3.45, 0.27, 0.28, 3.55, 3.88, 0xcfcac0);
box(3.84, 3.845, 1.05, 1.17, 3.6, 3.85, mat(0x55585e));                                   // 床头开关
box(1.72, 3.83, 2.27, 2.29, 3.86, 3.9, mat(0xffe2a8, { emissive: 0xffc060, emissiveIntensity: 0 })).name = 'strip';

// ---------- 阳台 ----------
const BAL = [0.8, 4.4];
wall(0, 3.8, 0, 5.0, 0, H, BAL, M.balc);
wall(1.6, 3.8, 1.6, 5.0, 0, H, BAL, M.balc);
wall(0, 3.8, 0.15, 3.8, 0, H, BAL, M.balc);
wall(0.15, 3.8, 1.05, 3.8, 2.1, H, BAL, M.balc);
wall(1.05, 3.8, 1.6, 3.8, 0, H, BAL, M.balc);
wall(0, 5.0, 1.6, 5.0, 0, 0.9, BAL, M.balc);
wall(0, 5.0, 1.6, 5.0, 2.4, H, BAL, M.balc);
windowAt(0.02, 1.58, 0.9, 2.4, 5.0);
rod([0.02, 1.08, 4.95], [1.58, 1.08, 4.95], 0.022, M.steel);          // 栏杆
// 黑框玻璃门（半开）
box(0.15, 0.2, 0, 2.1, 3.76, 3.84, M.black); box(1.0, 1.05, 0, 2.1, 3.76, 3.84, M.black); box(0.15, 1.05, 2.05, 2.1, 3.76, 3.84, M.black);
{
  const d = new THREE.Group();
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 1.95), M.glass); gl.position.set(0.4, 1.02, 0); d.add(gl);
  for (const [w, h, x, y] of [[0.8, 0.06, 0.4, 0.03], [0.8, 0.06, 0.4, 2.02], [0.06, 2.05, 0.03, 1.02], [0.06, 2.05, 0.77, 1.02]]) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.045), M.black); f.position.set(x, y, 0); f.castShadow = true; d.add(f);
  }
  const hd = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.14, 0.09), M.black); hd.position.set(0.74, 1.0, 0); d.add(hd);
  d.position.set(0.2, 0, -3.8); d.rotation.y = 1.25; scene.add(d);
}
curtain(0.02, 0.22, 0, 2.35, 3.7, 3).rotation.y = 0.3;
// 洗衣机
rbox(0.05, 0.65, 0, 0.85, 4.0, 4.6, mat(0xf4f4f2, { roughness: 0.35 }), 0.02);
{ const r = cyl(0.21, 0.03, 0.655, 0.42, 4.3, M.black); r.rotation.z = Math.PI / 2;
  const q = cyl(0.15, 0.035, 0.66, 0.42, 4.3, mat(0x30343b, { roughness: 0.05, metalness: 0.6 })); q.rotation.z = Math.PI / 2; }
box(0.3, 0.64, 0.78, 0.84, 4.05, 4.55, mat(0xe4e4e2, { roughness: 0.3 }));
for (const y of [1.25, 1.6]) box(0.05, 0.4, y, y + 0.02, 3.95, 4.7, M.steel);     // 置物架
for (const n of [3.96, 4.69]) rod([0.39, 0, n], [0.39, 1.62, n], 0.012, M.steel);
rbox(0.1, 0.85, 2.0, 2.52, 4.1, 4.5, mat(0xeeeeec, { roughness: 0.4 }), 0.02);    // 空调外机
rod([1.1, 0, 4.9], [1.1, 2.6, 4.9], 0.05, M.white);                                // 立管
// 窗下储物柜、黑椅子、拖把
box(0.7, 1.58, 0, 0.9, 4.7, 4.98, mat(0xd9d6cf, { roughness: 0.6 }));
for (const [a, b] of [[0.72, 1.13], [1.15, 1.56]]) for (const [c, d] of [[0.03, 0.42], [0.44, 0.66]]) box(a, b, c, d, 4.69, 4.7, mat(0xcbc8c1, { roughness: 0.5 }));
box(1.0, 1.4, 0.43, 0.46, 4.15, 4.55, M.black);
{ const b = box(1.0, 1.4, 0.5, 0.82, 4.55, 4.57, M.black); b.rotation.x = -0.12; }
for (const [x, n] of [[1.02, 4.17], [1.38, 4.17], [1.02, 4.53], [1.38, 4.53]]) rod([x, 0, n], [x, 0.44, n], 0.012, M.black);
rod([0.82, 0.05, 4.62], [0.86, 1.3, 4.68], 0.012, M.steel);
box(0.72, 0.92, 0, 0.05, 4.55, 4.67, mat(0xe9e9e6));

  } else {
    g.filter = 'blur(1.5px) brightness(1.15)';
    g.save();
    g.drawImage(pBalc, 470, 85, 330, 440, 0, 0, 768, 1024);     // 阳台正对的写字楼
    g.drawImage(pBed, 85, 220, 285, 368, 768, 0, 768, 1024);    // 床窗正对的住宅楼
    g.restore();
  }
  bdTex.needsUpdate = true;
}

// ---------- 白天 / 夜晚 ----------
let night = false;
const strip = scene.getObjectByName('strip');
function setNight(v) {
  night = v;
  paintBackdrop(v);
  scene.background.set(v ? 0x090a0e : 0xdfe3e6);
  scene.environmentIntensity = v ? 0.06 : 0.4;
  hemi.intensity = v ? 0.05 : 0.5;
  sun.intensity = v ? 0 : 3.2;
  lamp.intensity = v ? 9 : 1.5;
  lamp.color.set(v ? 0xffd9a8 : 0xfff3e0);
  cove.intensity = v ? 2.5 : 0;
  strip.material.emissiveIntensity = v ? 3 : 0;
  bnight.textContent = v ? '切到白天' : '切到夜晚';
  applyDesign(v);
}
setNight(false);

// ---------- 两个视角：外观 / 走进房间 ----------
let inside = false;
function setInside(v) {
  inside = v;
  if (v) { camera.position.set(1.75, 1.5, -0.35); controls.target.set(1.7, 1.25, -3.6); }
  else { camera.position.set(7.4, 7.6, 0.4); controls.target.set(1.9, 0.7, -2.1); }
  controls.update();
  bview.textContent = v ? '回到外观' : '走进房间';
}
setInside(false);
bview.onclick = () => setInside(!inside);
bnight.onclick = () => setNight(!night);
bdesign.onclick = () => { designOn = !designOn; setNight(night); };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  const p = camera.position;      // 相机在屋里才显示窗外照片，否则屋外会立着一块大背景板
  backdrop.visible = p.y < 2.6 && p.x > 0 && p.x < 3.85 && -p.z > -0.6 && -p.z < 5.4;
  renderer.render(scene, camera);
});
</script>
</body>
